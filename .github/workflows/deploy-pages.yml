name: Deploy freefall-weather to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "data/gfs_winds.json"
      - "data/aviation_weather.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Fetch NOAA GFS upper winds", "Fetch aviation weather"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/gfs_winds.json _site/data/gfs_winds.json
          if [ -f data/aviation_weather.json ]; then
            cp data/aviation_weather.json _site/data/aviation_weather.json
          fi
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

