name: Fetch aviation weather
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_aviation.py
  schedule:
    - cron: "7,37 * * * *"
permissions:
  contents: write
concurrency:
  group: aviation-weather
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch METAR, TAF and SIGMET
        run: python scripts/fetch_aviation.py
      - name: Commit successful aviation weather
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/aviation_weather.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update aviation weather"
            git push
          fi
