name: Fetch NOAA GFS upper winds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_gfs.py
  schedule:
    - cron: "25 1,7,13,19 * * *"
permissions:
  contents: write
concurrency:
  group: gfs-winds
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install GRIB reader
        run: python -m pip install "eccodes>=2.38,<3"
      - name: Fetch and parse GFS
        run: python scripts/fetch_gfs.py
      - name: Commit successful forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gfs_winds.json
          if ! git diff --cached --quiet; then
            git commit -m "data: update NOAA GFS upper winds"
            git fetch origin main
            git rebase origin/main
            git push
          fi

